name: Windows RC — validation non mutante

# Installe le RC DEJA CONSTRUIT sur un runner Windows propre et observe ce qui se passe.
# Ne construit rien, ne corrige rien, ne publie rien. Le RC n'est pas touche : l'artefact
# est telecharge tel quel et son empreinte verifiee avant toute execution.
#
# Un runner GitHub n'a ni Microsoft Word ni session interactive. Les etapes qui en
# dependent sont donc hors d'atteinte : elles sont consignees comme limites, pas comme
# echecs, et le job continue.

# workflow_dispatch n'apparait qu'une fois le workflow present sur la branche par defaut,
# et aucune fusion n'est autorisee ici. Le declencheur est donc le push sur cette branche,
# restreint au seul fichier de ce workflow pour ne pas se relancer a chaque commit.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ayant produit l'artefact humanorigin-windows-rc"
        required: false
        default: "36840343986"
  push:
    branches: [windows-private-beta-v1]
    paths: ['.github/workflows/windows-rc-validation.yml']

permissions:
  contents: read
  actions: read

env:
  SHA_ATTENDU: EB161389C5683EF7357BCD2D49C62427BD1657B2FD96AF2DEDDD5B09F05C1255

jobs:
  valider:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer le RC deja construit
        uses: actions/download-artifact@v4
        with:
          name: humanorigin-windows-rc
          run-id: ${{ inputs.run_id || '36840343986' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rc

      - name: Empreinte
        shell: pwsh
        run: |
          $exe = Get-ChildItem rc/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Aucun installateur dans l'artefact." }
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "Fichier   : $($exe.Name)  $($exe.Length) octets"
          Write-Host "Empreinte : $h"
          if ($h -ne $env:SHA_ATTENDU) { throw "Empreinte differente de celle qualifiee — ce n'est pas le RC." }
          Write-Host "PASS  l'empreinte correspond au RC qualifie."
          "INSTALLER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Etat de la machine avant installation
        shell: pwsh
        run: |
          $cat = 'HKCU:\Software\Microsoft\Office\16.0\WEF\TrustedCatalogs'
          Write-Host "Catalogue Word avant : $(if (Test-Path $cat) { (Get-ChildItem $cat).Count } else { 'cle absente' })"
          Write-Host "LOCALAPPDATA\HumanOrigin avant : $(Test-Path "$env:LOCALAPPDATA\HumanOrigin")"
          $word = Get-Command WINWORD.EXE -ErrorAction SilentlyContinue
          Write-Host "Microsoft Word : $(if ($word) { $word.Source } else { 'ABSENT — limite du runner, attendu' })"

      - name: Installer en silencieux
        shell: pwsh
        continue-on-error: true
        run: |
          # Empreinte du disque AVANT, pour voir exactement ce que l'installateur depose.
          $avant = @{}
          foreach ($r in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if ($r -and (Test-Path $r)) {
              Get-ChildItem $r -Directory -ErrorAction SilentlyContinue | ForEach-Object { $avant[$_.FullName] = $true }
            }
          }
          $avant.Keys | Out-File "$env:RUNNER_TEMP\avant.txt"
          Write-Host "Dossiers recenses avant : $($avant.Count)"

          # L'installateur NSIS de Tauri accepte /S pour une installation silencieuse.
          # Sans cela, aucun runner sans session interactive ne pourrait l'installer.
          Write-Host "Lancement : $env:INSTALLER /S"
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/S' -PassThru -Wait
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "L'installateur a rendu $($p.ExitCode)" }
          Write-Host "PASS  installation silencieuse terminee."

      - name: Ce que l'installateur a depose
        shell: pwsh
        continue-on-error: true
        run: |
          # Difference de dossiers entre avant et apres : si l'installateur a ecrit quelque
          # part, cela se voit ici, quel que soit le chemin qu'il a choisi.
          $avant = @{}
          if (Test-Path "$env:RUNNER_TEMP\avant.txt") {
            Get-Content "$env:RUNNER_TEMP\avant.txt" | ForEach-Object { if ($_) { $avant[$_] = $true } }
          }
          $nouveaux = @()
          foreach ($r in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            if ($r -and (Test-Path $r)) {
              foreach ($d in Get-ChildItem $r -Directory -ErrorAction SilentlyContinue) {
                if (-not $avant.ContainsKey($d.FullName)) { $nouveaux += $d.FullName }
              }
            }
          }
          if ($nouveaux) {
            Write-Host "NOUVEAUX dossiers apparus :"
            $nouveaux | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "AUCUN nouveau dossier sous LOCALAPPDATA, ProgramFiles ou ProgramFiles(x86)."
          }

          Write-Host "--- recherche de HumanOrigin.exe sur tout le disque systeme ---"
          $t = Get-ChildItem C:\ -Recurse -Filter 'HumanOrigin.exe' -ErrorAction SilentlyContinue -Force |
               Select-Object -First 5
          if ($t) { $t | ForEach-Object { Write-Host "  TROUVE $($_.FullName)" } }
          else    { Write-Host "  INTROUVABLE sur C:\" }

          Write-Host "--- entrees de desinstallation contenant HumanOrigin ---"
          $vu = $false
          foreach ($r in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                           'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
            if (Test-Path $r) {
              foreach ($c in Get-ChildItem $r -ErrorAction SilentlyContinue) {
                $p = Get-ItemProperty $c.PSPath -ErrorAction SilentlyContinue
                if ($p.DisplayName -like '*HumanOrigin*') {
                  Write-Host "  $($p.DisplayName)  InstallLocation=$($p.InstallLocation)"; $vu = $true
                }
              }
            }
          }
          if (-not $vu) { Write-Host "  aucune" }

          Write-Host "--- WebView2 present ? ---"
          $wv = $false
          foreach ($cle in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                             'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')) {
            if (Test-Path $cle) { Write-Host "  $((Get-ItemProperty $cle).pv)"; $wv = $true }
          }
          if (-not $wv) { Write-Host "  WebView2 ABSENT" }

      - name: Inventaire des fichiers attendus
        shell: pwsh
        continue-on-error: true
        run: |
          # Ne pas DEVINER le chemin : le lire la ou l'installateur l'a inscrit. Une premiere
          # version supposait %LOCALAPPDATA%\Programs\HumanOrigin et echouait alors que
          # l'installation avait reussi — Tauri en mode currentUser pose ailleurs.
          $dossier = $null
          foreach ($r in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                           'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
            if (-not (Test-Path $r)) { continue }
            foreach ($c in Get-ChildItem $r -ErrorAction SilentlyContinue) {
              $p = Get-ItemProperty $c.PSPath -ErrorAction SilentlyContinue
              if ($p.DisplayName -like '*HumanOrigin*' -and $p.InstallLocation) {
                $dossier = $p.InstallLocation; break
              }
            }
            if ($dossier) { break }
          }
          if (-not $dossier) {
            # Repli : chercher l'executable sous les emplacements plausibles.
            $t = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
                   -Recurse -Filter 'HumanOrigin.exe' -Depth 3 -ErrorAction SilentlyContinue |
                 Select-Object -First 1
            if ($t) { $dossier = $t.DirectoryName }
          }
          if (-not $dossier) { throw "Aucun dossier d'installation trouve." }
          Write-Host "Dossier : $dossier"
          Get-ChildItem $dossier -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

          $attendus = @('HumanOrigin.exe','pdfium.dll','humanorigin-publisher.exe','humanorigin-converter.exe','uninstall.exe')
          $manquants = @()
          foreach ($f in $attendus) {
            $t = Get-ChildItem $dossier -Recurse -Filter $f -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($t) { Write-Host ("PASS  {0,-28} {1} octets" -f $f, $t.Length) }
            else    { Write-Host "FAIL  $f ABSENT"; $manquants += $f }
          }
          if ($manquants) { throw "Fichiers manquants : $($manquants -join ', ')" }

          # pdfium.dll doit etre SOEUR de l'executable : le code la cherche a cote de lui.
          $exe = Get-ChildItem $dossier -Recurse -Filter 'HumanOrigin.exe' | Select-Object -First 1
          $dll = Join-Path $exe.DirectoryName 'pdfium.dll'
          if (Test-Path $dll) { Write-Host "PASS  pdfium.dll est bien a cote de HumanOrigin.exe" }
          else { throw "pdfium.dll n'est pas dans le meme dossier que l'executable." }
          "DOSSIER=$dossier" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Entree de desinstallation
        shell: pwsh
        continue-on-error: true
        run: |
          $trouve = $false
          foreach ($r in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                           'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
            if (Test-Path $r) {
              foreach ($c in Get-ChildItem $r -ErrorAction SilentlyContinue) {
                $p = Get-ItemProperty $c.PSPath -ErrorAction SilentlyContinue
                if ($p.DisplayName -like '*HumanOrigin*') {
                  Write-Host "PASS  $($p.DisplayName) v$($p.DisplayVersion)"
                  Write-Host "      $($p.UninstallString)"
                  $trouve = $true
                }
              }
            }
          }
          if (-not $trouve) { throw "Aucune entree de desinstallation." }

      - name: Catalogue Word — limite attendue
        shell: pwsh
        run: |
          # La cle n'est ecrite que lorsque l'UTILISATEUR demande l'installation du
          # complement depuis l'application. Elle ne peut donc pas exister ici : aucune
          # session interactive, aucun Word. C'est une limite du runner, pas un echec.
          $cat = 'HKCU:\Software\Microsoft\Office\16.0\WEF\TrustedCatalogs'
          if (Test-Path $cat) {
            Write-Host "Catalogues declares : $((Get-ChildItem $cat).Count)"
            Get-ChildItem $cat | ForEach-Object {
              $p = Get-ItemProperty $_.PSPath
              Write-Host "  $($_.PSChildName)  Url=$($p.Url)  Flags=$($p.Flags)"
            }
          } else {
            Write-Host "LIMITE  Cle TrustedCatalogs absente — attendu : le complement n'est declare"
            Write-Host "        que sur geste explicite de l'utilisateur dans l'application."
          }

      - name: Lancer l'application — limite attendue
        shell: pwsh
        continue-on-error: true
        run: |
          # Sans session interactive, WebView2 ne peut pas afficher de fenetre. On observe
          # seulement si le processus demarre et survit quelques secondes.
          $exe = Join-Path $env:DOSSIER 'HumanOrigin.exe'
          Write-Host "Tentative : $exe"
          $p = Start-Process -FilePath $exe -PassThru -ErrorAction SilentlyContinue
          if (-not $p) { Write-Host "LIMITE  Le processus n'a pas pu demarrer (pas de session interactive)."; exit 0 }
          Start-Sleep -Seconds 12
          $vivant = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if ($vivant) {
            Write-Host "OBSERVE  Le processus tourne encore apres 12 s (PID $($p.Id))."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "OBSERVE  Le processus s'est termine avant 12 s. Code : $($p.ExitCode)"
            Write-Host "LIMITE   Sans affichage, cela ne prouve ni ne refute un demarrage correct."
          }

      - name: Desinstaller
        shell: pwsh
        continue-on-error: true
        run: |
          $u = Get-ChildItem $env:DOSSIER -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $u) { throw "uninstall.exe introuvable." }
          $p = Start-Process -FilePath $u.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "Code de sortie : $($p.ExitCode)"
          Start-Sleep -Seconds 5

      - name: Ce qui reste apres desinstallation
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path $env:DOSSIER) {
            Write-Host "RESTE  Le dossier d'installation existe encore :"
            Get-ChildItem $env:DOSSIER -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "PASS   Le dossier d'installation a disparu."
          }
          $donnees = "$env:LOCALAPPDATA\HumanOrigin"
          if (Test-Path $donnees) {
            Write-Host "RESTE  Les donnees utilisateur survivent (attendu) :"
            Get-ChildItem $donnees -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize
          } else {
            Write-Host "OBSERVE  Aucune donnee utilisateur (aucune n'avait ete creee)."
          }
          $reste = $false
          foreach ($r in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                           'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
            if (Test-Path $r) {
              foreach ($c in Get-ChildItem $r -ErrorAction SilentlyContinue) {
                $p = Get-ItemProperty $c.PSPath -ErrorAction SilentlyContinue
                if ($p.DisplayName -like '*HumanOrigin*') { Write-Host "RESTE  entree : $($p.DisplayName)"; $reste = $true }
              }
            }
          }
          if (-not $reste) { Write-Host "PASS   Plus d'entree de desinstallation." }

      - name: Reinstaller
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath $env:INSTALLER -ArgumentList '/S' -PassThru -Wait
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "La reinstallation a rendu $($p.ExitCode)" }
          $exe = Get-ChildItem $env:DOSSIER -Recurse -Filter 'HumanOrigin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "HumanOrigin.exe absent apres reinstallation." }
          Write-Host "PASS  reinstallation par-dessus reussie."

          # Le point que la cle de registre fixe est censee garantir : pas de doublon.
          $cat = 'HKCU:\Software\Microsoft\Office\16.0\WEF\TrustedCatalogs'
          if (Test-Path $cat) {
            $n = (Get-ChildItem $cat).Count
            Write-Host "Catalogues declares apres reinstallation : $n"
            if ($n -gt 1) { Write-Host "ATTENTION  plus d'un catalogue — a examiner." }
          } else {
            Write-Host "LIMITE  Toujours aucun catalogue : le complement n'a jamais ete installe ici."
          }

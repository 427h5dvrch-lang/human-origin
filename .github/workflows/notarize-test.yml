name: Notarize Test (macOS)

# Qualification uniquement. Le push déclenche ce workflow sur la SEULE branche first-run-v1-p0 :
# aucun tag, aucune release publiée, aucun latest.json. Le DMG est joint à la release BROUILLON
# v0.3.0 existante, jamais publié comme artefact Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - first-run-v1-p0

permissions:
  contents: write

jobs:
  notarize-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (NPM)
        run: npm ci

      # Décodage de la clé App Store Connect (.p8) vers un fichier temporaire
      # éphémère du runner. Le secret n'est jamais imprimé ; le .p8 n'est jamais committé.
      - name: Prepare Apple API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = os.environ["APPLE_API_KEY_P8_BASE64"]
          out = Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          out.write_bytes(base64.b64decode(data))
          out.chmod(0o600)
          PY

      - name: Download libpdfium
        run: |
          curl -fsSL \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7690/pdfium-mac-arm64.tgz" \
            | tar xz lib/libpdfium.dylib
          cp lib/libpdfium.dylib src-tauri/libpdfium.dylib

      # Build local signé Developer ID + notarisé + staplé (PAS de tauri-action,
      # donc aucune release et aucun tag ne peuvent être créés).
      - name: Build signed + notarized macOS bundles
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles app,dmg

      # Tauri notarise/staple le .app mais pas le .dmg : on notarise et staple
      # explicitement le DMG, qui est l'artefact réel de distribution.
      - name: Notarize and staple DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "DMG: $DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"

      - name: Verify signature, notarization and stapling
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n1)
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "App: $APP"
          echo "DMG: $DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv --type exec "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      # Diffusion restreinte : le DMG de qualification est ajouté à la release BROUILLON v0.3.0, sous
      # un nom portant le commit réellement construit. Aucun remplacement, aucun tag, aucune publication.
      - name: Attach qualification DMG to the draft release v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          SHA12=$(git rev-parse --short=12 HEAD)
          echo "Commit construit : $GITHUB_SHA"
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          NAME="HumanOrigin_0.3.0-qualification-post-v0.3.0-${SHA12}_aarch64.dmg"
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          REL=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c '[.[] | select(.tag_name == "v0.3.0")]')
          test "$(echo "$REL" | jq length)" = "1" || { echo "Release v0.3.0 introuvable ou multiple : arrêt"; exit 1; }
          echo "$REL" | jq -e '.[0].draft == true' >/dev/null || { echo "La release v0.3.0 n'est pas en brouillon : arrêt"; exit 1; }
          ID=$(echo "$REL" | jq -r '.[0].id')
          echo "Avant ajout : brouillon=$(echo "$REL" | jq -r '.[0].draft') · pré-release=$(echo "$REL" | jq -r '.[0].prerelease')"
          echo "$REL" | jq -r '.[0].assets[].name' | tee assets_before.txt
          if grep -qxF "$NAME" assets_before.txt; then echo "Un fichier de ce nom existe déjà : arrêt sans remplacement"; exit 1; fi
          cp "$DMG" "$NAME"
          shasum -a 256 "$NAME"
          api -X POST -H "Content-Type: application/octet-stream" --data-binary @"$NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$NAME" | jq -r '"Ajouté : " + .name + " (" + (.size|tostring) + " octets)"'
          AFTER=$(api "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID")
          echo "$AFTER" | jq -e '.draft == true' >/dev/null || { echo "La release n'est plus en brouillon"; exit 1; }
          echo "Après ajout : brouillon=$(echo "$AFTER" | jq -r .draft) · pré-release=$(echo "$AFTER" | jq -r .prerelease)"
          echo "$AFTER" | jq -r '.assets[].name'

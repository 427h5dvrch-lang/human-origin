# Windows Release Signed — chaîne complète, SANS publication.
#
# Ce workflow applique l'ordre décidé en Control Tower, et rien d'autre :
#   1. construire le release Windows depuis le contenu de main ;
#   2. signer Authenticode l'EXE final avec Azure Artifact Signing (Trusted Signing) ;
#   3. vérifier cette signature sur la machine Windows ;
#   4. reconstruire l'archive updater .nsis.zip à partir de l'EXE SIGNÉ ;
#   5. recalculer la signature minisign de cette archive avec la clé updater existante ;
#   6. vérifier que l'EXE autonome et l'EXE extrait de l'archive sont octet pour octet identiques.
#
# Pourquoi cet ordre. Mesure du 9 octobre 2026 : l'archive de mise à jour CONTIENT l'installeur,
# octet pour octet. Signer l'EXE après le bundling laisserait donc l'archive envelopper un binaire
# non signé, et la signature minisign couvrirait ce contenu non signé — l'installeur téléchargé et
# celui que l'updater pose seraient deux binaires différents. L'archive est donc reconstruite.
#
# Ce que ce workflow ne fait PAS :
#   · aucune Release GitHub créée ou modifiée : `permissions: contents: read` l'interdit ;
#   · aucun latest.json touché ;
#   · aucun artefact macOS produit ou modifié ;
#   · aucune migration Tauri v2 : la signature n'entre pas dans le bundler, elle s'applique après.
#
# Déclenchement manuel uniquement. Les artefacts repartent par upload-artifact.
name: Windows Release Signed

on:
  workflow_dispatch:

permissions:
  contents: read
  # Nécessaire au jeton OIDC de courte durée échangé avec Entra ID. Aucun secret de signature
  # n'est stocké dans ce dépôt : l'identité de CI est fédérée sur ce ref précis.
  id-token: write

env:
  AZURE_ENDPOINT: https://neu.codesigning.azure.net/
  AZURE_CODE_SIGNING_ACCOUNT: humanorigin-signing
  AZURE_CERT_PROFILE: humanorigin-public-trust

jobs:
  windows-release-signed:
    name: Build, Authenticode-sign and rebuild the updater archive
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Show versions
        shell: pwsh
        run: node --version; npm --version; rustc --version; cargo --version

      - name: Verify Windows sidecars are present
        shell: pwsh
        run: |
          $manquants = @()
          foreach ($f in @(
            "src-tauri/binaries/humanorigin-publisher-x86_64-pc-windows-msvc.exe",
            "src-tauri/binaries/humanorigin-converter-x86_64-pc-windows-msvc.exe")) {
            if (!(Test-Path $f)) { $manquants += $f }
          }
          if ($manquants.Count -gt 0) { Write-Error "Sidecars manquants : $($manquants -join ', ')" }

      # L'updater DOIT rester actif, sinon Tauri n'émet ni archive ni signature. Et aucun
      # certificateThumbprint ne doit apparaître : la signature Authenticode passe par Trusted
      # Signing APRÈS le bundling, pas par signtool dans le bundler Tauri v1.
      - name: Assert updater active and no Tauri-side Authenticode
        shell: pwsh
        run: |
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $json.tauri.updater.active) { Write-Error "updater.active doit rester true" }
          if ($json.tauri.updater.pubkey.Length -lt 50) { Write-Error "updater.pubkey absente ou trop courte" }
          $w = $json.tauri.bundle.windows
          if ($w.certificateThumbprint) { Write-Error "certificateThumbprint configure : la signature doit rester hors du bundler" }
          Write-Host "updater actif, pubkey presente, aucune signature cote bundler."

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ---- 1. release Windows
      - name: Build Windows release bundles
        shell: pwsh
        env:
          CI: true
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Record pre-signature state
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe"
          $zip = Get-ChildItem $nsis -Filter "*-setup.nsis.zip"
          if (-not $exe) { Write-Error "installeur absent" }
          if (-not $zip) { Write-Error "archive updater absente" }
          Write-Host "installeur non signe : $($exe.Name) $($exe.Length) octets"
          Write-Host "sha256 : $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          Write-Host "archive d'origine   : $($zip.Name) $($zip.Length) octets"
          "$($exe.FullName)" | Out-File -FilePath exe_path.txt -Encoding ascii -NoNewline

      # ---- 2. Authenticode, via l'identité de CI fédérée
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ env.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ env.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERT_PROFILE }}
          files-folder: src-tauri/target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ---- 3. vérification sur la machine Windows
      - name: Verify Authenticode on Windows
        shell: pwsh
        run: |
          $exe = (Get-Content exe_path.txt -Raw).Trim()
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool introuvable" }
          & $signtool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify a echoue" }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "statut   : $($sig.Status)"
          Write-Host "sujet    : $($sig.SignerCertificate.Subject)"
          Write-Host "empreinte: $($sig.SignerCertificate.Thumbprint)"
          if ($sig.Status -ne "Valid") { Write-Error "signature Authenticode non valide : $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike "*DAZEAS CORP*") {
            Write-Error "le certificat signataire n'est pas DAZEAS CORP : $($sig.SignerCertificate.Subject)"
          }

      # ---- 4. reconstruire l'archive updater sur l'EXE SIGNÉ
      - name: Rebuild the updater archive from the signed installer
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe"
          $zip = Get-ChildItem $nsis -Filter "*-setup.nsis.zip"
          $zipPath = $zip.FullName
          # L'ancienne archive enveloppe l'EXE non signé, et son .sig couvre ce contenu : les deux
          # sont retirés plutot que corriges, pour qu'aucun reste ne puisse etre pris pour l'actuel.
          Remove-Item $zipPath -Force
          Remove-Item "$zipPath.sig" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $exe.FullName -DestinationPath $zipPath -CompressionLevel Optimal
          $neuf = Get-Item $zipPath
          Write-Host "archive reconstruite : $($neuf.Name) $($neuf.Length) octets"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            Write-Host "entrees : $($z.Entries.Count)"
            foreach ($e in $z.Entries) { Write-Host "  $($e.FullName) $($e.Length)" }
            if ($z.Entries.Count -ne 1) { Write-Error "l'archive doit contenir exactement l'installeur" }
            if ($z.Entries[0].FullName -ne $exe.Name) {
              Write-Error "nom d'entree inattendu : $($z.Entries[0].FullName), attendu $($exe.Name)"
            }
          } finally { $z.Dispose() }

      # ---- 5. recalculer la signature minisign avec la clé updater EXISTANTE
      - name: Re-sign the updater archive with the existing updater key
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          # L'interface exacte de la CLI est journalisee : si elle change, le log le dit.
          npm run tauri -- signer sign --help
          $zip = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.nsis.zip"
          npm run tauri -- signer sign -k "$env:TAURI_PRIVATE_KEY" -p "$env:TAURI_KEY_PASSWORD" "$($zip.FullName)"
          if ($LASTEXITCODE -ne 0) { Write-Error "la signature minisign a echoue" }
          $sig = Get-Item "$($zip.FullName).sig"
          $contenu = Get-Content $sig.FullName -Raw
          Write-Host "signature : $($sig.Name) $($sig.Length) octets"
          if (-not $contenu.StartsWith("dW50cnVzdGVkIGNvbW1lbnQ6")) { Write-Error "la signature n'est pas un bloc minisign" }
          $clair = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($contenu.Trim()))
          Write-Host $clair
          if ($clair -notmatch [regex]::Escape("file:$($zip.Name)")) {
            Write-Error "le commentaire de confiance ne nomme pas cette archive"
          }

      # ---- 6. l'EXE autonome et celui de l'archive doivent être le même binaire
      - name: Assert standalone EXE and archived EXE are byte-identical
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe"
          $zip = Get-ChildItem $nsis -Filter "*-setup.nsis.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "verif_zip"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $tmp
          $extrait = Get-ChildItem $tmp -Filter "*-setup.exe"
          $a = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $b = (Get-FileHash $extrait.FullName -Algorithm SHA256).Hash
          Write-Host "exe autonome       : $a  $($exe.Length) octets"
          Write-Host "exe dans l'archive : $b  $($extrait.Length) octets"
          if ($a -ne $b) { Write-Error "l'EXE de l'archive n'est pas celui qui est distribue" }
          # Et il doit etre signe : sans ce controle, l'identite ci-dessus pourrait porter sur
          # deux copies du binaire NON signe.
          $s = Get-AuthenticodeSignature $extrait.FullName
          Write-Host "signature de l'exe extrait : $($s.Status) · $($s.SignerCertificate.Subject)"
          if ($s.Status -ne "Valid") { Write-Error "l'exe de l'archive n'est pas signe validement" }

      - name: Show final artifacts
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis -File |
            ForEach-Object { "{0,12}  {1}  {2}" -f $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.Substring(0,24), $_.Name }

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: humanorigin-windows-0.3.4-signed
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig

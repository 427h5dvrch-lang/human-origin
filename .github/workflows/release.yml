name: Release HumanOrigin

permissions:
  contents: write

on:
  push:
    tags:
      # Le dépôt porte des tags historiques « v24 », « v25 »… que « v* » attrapait : un
      # tag sans rapport pouvait déclencher une release. On exige donc vX.Y.Z.
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        # macOS Apple Silicon et Windows x64. Chaque plateforme produit ses artefacts et
        # sa ligne dans latest.json : sans Windows ici, l'updater Windows n'existe pas.
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      # GARDE-FOU DE RELEASE. Le tag nomme la Release, la version embarquée nomme les
      # artefacts : si les deux divergent, une Release « v0.3.2 » livre des binaires 0.3.1,
      # et cela ne se voit qu'à l'installation. Six emplacements déclarent cette version ;
      # ils doivent tous concorder avec le tag. Aucune dépendance npm requise ici : le
      # contrôle passe avant l'installation, pour échouer au plus tôt et au moins cher.
      - name: Version coherence (tag vs sources)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node tools/release/version_coherence.mjs --tag "$GITHUB_REF_NAME"
          else
            node tools/release/version_coherence.mjs
          fi

      # Le banc de l'outillage lui-même : analyse des arguments, détection de chaque dérive
      # de version, refus avant écriture. Il ne touche qu'un bac à sable temporaire.
      - name: Release tooling benches
        run: node tools/release/tests/release_tooling.mjs

      - name: Install dependencies (NPM)
        run: npm ci

      # Le banc frontend AVANT le build. Vite assemble sans vérifier qu'un identifiant est
      # défini, et les assets de marque ne sont contrôlés nulle part ailleurs : une release
      # pouvait partir avec un Creator Shell qui ne démarre pas. Elle ne le peut plus.
      - name: Frontend benches
        run: npm run check:frontend

      # Décodage de la clé App Store Connect (.p8) vers un fichier temporaire
      # éphémère du runner. Le secret n'est jamais imprimé ; le .p8 n'est jamais committé.
      - name: Prepare Apple API key (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = os.environ["APPLE_API_KEY_P8_BASE64"]
          out = Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          out.write_bytes(base64.b64decode(data))
          out.chmod(0o600)
          PY

      - name: Download libpdfium (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          curl -fsSL \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7690/pdfium-mac-arm64.tgz" \
            | tar xz lib/libpdfium.dylib
          cp lib/libpdfium.dylib src-tauri/libpdfium.dylib

      # Meme version de PDFium que macOS, variante Windows x64. La DLL se pose a cote de
      # l'executable : une installation NSIS est plate, il n'y a pas de dossier Frameworks.
      - name: Download PDFium (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7690/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          tar -xzf pdfium.tgz bin/pdfium.dll
          Copy-Item bin/pdfium.dll src-tauri/pdfium.dll
          $t = (Get-Item src-tauri/pdfium.dll).Length
          if ($t -lt 1000000) { throw "pdfium.dll suspecte : $t octets" }
          Write-Host "pdfium.dll : $t octets"

      # `resources` ne peut pas vivre dans le fichier commite : Tauri v1 echoue si le motif
      # ne correspond a rien, et le build macOS se casserait. Injection ici, Windows seul.
      - name: Declare pdfium.dll as a resource (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $chemin = "src-tauri/tauri.conf.json"
          $json = Get-Content $chemin -Raw | ConvertFrom-Json
          $json.tauri.bundle | Add-Member -NotePropertyName resources -NotePropertyValue @("pdfium.dll") -Force
          $json | ConvertTo-Json -Depth 100 | Set-Content $chemin -Encoding UTF8

      # Un sidecar macOS depose par erreur passerait un controle de taille, pas celui-ci.
      - name: Verify Windows sidecars (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($f in @(
            "src-tauri/binaries/humanorigin-publisher-x86_64-pc-windows-msvc.exe",
            "src-tauri/binaries/humanorigin-converter-x86_64-pc-windows-msvc.exe")) {
            if (!(Test-Path $f)) { throw "Sidecar manquant : $f" }
            $o = [System.IO.File]::ReadAllBytes($f)[0..1]
            if ($o[0] -ne 0x4D -or $o[1] -ne 0x5A) { throw "Pas un executable Windows : $f" }
            Write-Host "OK  $f  ($((Get-Item $f).Length) octets)"
          }

      # 🚀 CONSTRUCTION, SIGNATURE DEVELOPER ID, NOTARISATION ET RELEASE
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater (signature des artefacts de mise à jour)
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Signature Developer ID (inchangée)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation via App Store Connect API key — macOS uniquement (vide ailleurs)
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ matrix.platform == 'macos-latest' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Le tag poussé fait autorité, et lui seul : la version embarquée nomme les artefacts de
          # l'application, elle ne décide plus dans quelle Release GitHub ils atterrissent. Ainsi
          # v0.3.0-rc.1 va dans la release v0.3.0-rc.1, et un futur v0.3.0 dans la release v0.3.0.
          tagName: ${{ github.ref_name }}
          releaseName: "HumanOrigin ${{ github.ref_name }}"
          releaseBody: "Release signed (Developer ID) and notarized."
          # Brouillon : rien ne devient public sans un geste explicite. Mais plus une
          # préversion : `releases/latest` les exclut par définition, et l'updater lit
          # précisément `releases/latest/download/latest.json`.
          releaseDraft: true
          prerelease: false

      # Tauri staple le .app mais pas le .dmg, et tauri-action a déjà uploadé le
      # .dmg non staplé : on notarise + staple le .dmg puis on remplace l'asset.
      - name: Notarize and staple DMG (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          echo "DMG: $DMG"
          echo "Version: $VERSION"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          gh release upload "${GITHUB_REF_NAME}" "$DMG" --clobber

      # Vérification post-build : échoue si Gatekeeper n'accepte pas l'app
      # (notarisation absente) ou si le DMG n'est pas staplé.
      - name: Verify macOS notarization (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -n1)
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          echo "App: $APP"
          echo "DMG: $DMG"
          spctl -a -vvv --type exec "$APP"
          xcrun stapler validate "$DMG"

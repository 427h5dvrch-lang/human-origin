# Migration unique des cinq vrais secrets — dépôt PUBLIC vers dépôt PRIVÉ.
#
# CE FICHIER EST EN ATTENTE. Il ne vit pas encore dans `.github/workflows/` : tant qu'il est
# ici, GitHub ne le connaît pas et il ne peut pas s'exécuter. Il sera copié dans le dépôt
# public au moment de l'opération, puis retiré aussitôt après.
#
# Pourquoi il doit tourner dans le dépôt PUBLIC : c'est le seul endroit où les cinq valeurs
# sont accessibles à un processus. GitHub ne les révèle nulle part ailleurs, et c'est la
# garantie même du système — on ne la contourne pas, on s'en sert.
#
# Aucune valeur n'est imprimée, ni passée en argument de ligne de commande, ni écrite sur
# disque. Elle est injectée dans l'environnement d'une étape par GitHub, puis poussée par
# l'entrée standard. Elle n'atteint donc ni `ps`, ni l'historique du shell, ni le journal —
# que GitHub masquerait de toute façon.
name: migrate secrets once

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Taper MIGRER pour confirmer"
        required: true
        type: string

# Lecture seule sur le contenu : ce workflow ne touche ni au code, ni aux releases, ni aux
# tags, ni aux assets, ni à latest.json.
permissions:
  contents: read

jobs:
  migrer:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation explicite
        run: |
          if [ "${{ inputs.confirmer }}" != "MIGRER" ]; then
            echo "::error::Confirmation absente — rien n'a été transféré."
            exit 1
          fi

      # `--body` prend la VALEUR littérale : `--body -` poserait le secret à « - ».
      # L'entrée standard n'est lue que si `--body` est absent. Il l'est donc partout ici.
      - name: Transférer les cinq secrets
        env:
          GH_TOKEN: ${{ secrets.HO_MIGRATION_TOKEN }}
          V1: ${{ secrets.APPLE_CERTIFICATE }}
          V2: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          V3: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          V4: ${{ secrets.TAURI_PRIVATE_KEY }}
          V5: ${{ secrets.TAURI_KEY_PASSWORD }}
          CIBLE: 427h5dvrch-lang/human-origin-private
        run: |
          set -u
          manquants=""
          for n in V1 V2 V3 V4 V5 GH_TOKEN; do
            eval "v=\${$n}"
            [ -z "$v" ] && manquants="$manquants $n"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Valeurs absentes du dépôt public :$manquants"
            exit 1
          fi

          printf '%s' "$V1" | gh secret set APPLE_CERTIFICATE          --repo "$CIBLE" --app actions
          printf '%s' "$V2" | gh secret set APPLE_CERTIFICATE_PASSWORD --repo "$CIBLE" --app actions
          printf '%s' "$V3" | gh secret set APPLE_API_KEY_P8_BASE64    --repo "$CIBLE" --app actions
          printf '%s' "$V4" | gh secret set TAURI_PRIVATE_KEY          --repo "$CIBLE" --app actions
          printf '%s' "$V5" | gh secret set TAURI_KEY_PASSWORD         --repo "$CIBLE" --app actions

          echo "cinq transferts effectués"

      # On ne vérifie que des NOMS. Comparer des valeurs supposerait de les relire, ce que
      # GitHub interdit — et ce qu'on ne souhaite pas.
      - name: Vérifier par les noms, jamais par les valeurs
        env:
          GH_TOKEN: ${{ secrets.HO_MIGRATION_TOKEN }}
          CIBLE: 427h5dvrch-lang/human-origin-private
        run: |
          noms=$(gh secret list --repo "$CIBLE" --app actions --json name --jq '.[].name' | sort)
          echo "— secrets présents dans le dépôt privé —"
          echo "$noms" | sed 's/^/  /'
          manque=""
          for n in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 \
                   TAURI_PRIVATE_KEY TAURI_KEY_PASSWORD; do
            echo "$noms" | grep -qx "$n" || manque="$manque $n"
          done
          if [ -n "$manque" ]; then
            echo "::error::Noms absents après transfert :$manque"
            exit 1
          fi
          echo "Les cinq noms attendus sont présents."

name: Build (contrôle)

# Ce workflow NE PUBLIE RIEN. Il compile et dépose les artefacts dans l'exécution GitHub Actions,
# où seules les personnes ayant accès au dépôt peuvent les récupérer, et où ils expirent.
#
# Le seul chemin vers une Release GitHub est release.yml, déclenché par un tag v*, qui publie en
# brouillon et en préversion. Cette séparation est volontaire : un déclenchement manuel ne doit
# pas pouvoir créer une release publique, ni déplacer releases/latest, que l'updater interroge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --bin human-origin
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        # Ni GITHUB_TOKEN, ni releaseId, ni tagName : l'action ne peut donc rien publier.
      - name: Collect bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
